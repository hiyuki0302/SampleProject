name: Build
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release build'
        required: false
        type: boolean

  push:
    branches:
      - 'add'
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'action.yaml'
      - 'package-lock.json'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16.x'
      - name: Create release build
        if: ${{ inputs.release }}
        run: |
          npm ci
          npm run build
      - name: Create debug build
        if: ${{ !inputs.release }}
        run: |
          git config --global user.email "crypto.streeeet@gmail.com"
          git config --global user.name "hiyuki0302"
          git fetch origin release
          git switch release
          git merge add
          npm ci
          npm run build
      - name: Push to GitHub
        uses: EndBug/add-and-commit@v9.1.1
        with:
          add: '-f ./dist'
          author_name: 'hiyuki0302'
          author_email: 'crypto.streeeet@gmail.com'
          message: 'build: Build action'
